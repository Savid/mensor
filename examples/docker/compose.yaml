# A host, and hands for two minds: `a1` and `b2` for `m`, `c3` for `n`, each
# in a container of its own. Only the host holds the model's credential and
# the host's token, and only the hands run the model's commands. Each mind's
# hands hold a token made for that mind, which reaches it and its children
# alone.
name: mensor

x-mensor: &mensor
  build:
    context: ../..
    dockerfile: examples/docker/Dockerfile
  image: mensor-example

services:
  host:
    <<: *mensor
    command: serve --listen 0.0.0.0:7878 --store /data/mensor.sqlite --model ${MENSOR_MODEL:-claude-opus-5-5}
    environment:
      MENSOR_TOKEN: ${MENSOR_TOKEN:?set MENSOR_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    ports: ["127.0.0.1:7878:7878"]
    volumes: [store:/data]

  a1:
    <<: *mensor
    command: hand --url ws://host:7878/v1/attach --mind m --hand a1 --dir work
    environment:
      MENSOR_TOKEN: ${MENSOR_M_TOKEN:?set MENSOR_M_TOKEN to a token for m}

  b2:
    <<: *mensor
    command: hand --url ws://host:7878/v1/attach --mind m --hand b2 --dir work
    environment:
      MENSOR_TOKEN: ${MENSOR_M_TOKEN:?set MENSOR_M_TOKEN to a token for m}

  c3:
    <<: *mensor
    command: hand --url ws://host:7878/v1/attach --mind n --hand c3 --dir work
    environment:
      MENSOR_TOKEN: ${MENSOR_N_TOKEN:?set MENSOR_N_TOKEN to a token for n}

volumes:
  store:
