[package]
name = "mensor"
default-run = "mensor"
description = "Run a mind's host, a hand that dials one, or both in one process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

# The two halves alone. Their names are those of the library crates
# `mensor-mind` and `mensor-hand`, so only those are documented.
[[bin]]
name = "mensor-mind"
doc = false

[[bin]]
name = "mensor-hand"
doc = false

[dependencies]
clap.workspace = true
mensor-hand.workspace = true
mensor-hand-host.workspace = true
mensor-mind.workspace = true
mensor-mind-host.workspace = true
mensor-model.workspace = true
mensor-protocol.workspace = true
mensor-store-sqlite.workspace = true
tokio = { workspace = true, features = ["macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["process"] }

[dev-dependencies]
axum.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
