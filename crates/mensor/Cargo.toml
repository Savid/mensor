[package]
name = "mensor"
description = "Run a mind's host, a body that dials one, or both in one process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

# The two halves alone. Their names are those of the library crates
# `mensor-mind` and `mensor-body`, so only those are documented.
[[bin]]
name = "mensor-mind"
doc = false

[[bin]]
name = "mensor-body"
doc = false

[dependencies]
clap.workspace = true
mensor-body.workspace = true
mensor-body-host.workspace = true
mensor-mind.workspace = true
mensor-mind-host.workspace = true
mensor-model.workspace = true
mensor-protocol.workspace = true
mensor-store-sqlite.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
reqwest.workspace = true
rustls.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
