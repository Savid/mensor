[package]
name = "mensor-cloudflare"
description = "mensor on Cloudflare Workers: each pair is one Durable Object"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
# The worker is the cdylib. Building the rlib beside it makes the module
# about 6% smaller.
crate-type = ["cdylib", "rlib"]

[dependencies]
futures-channel.workspace = true
futures-util.workspace = true
mensor-api.workspace = true
mensor-body.workspace = true
mensor-model.workspace = true
mensor-mind.workspace = true
mensor-object.workspace = true
mensor-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
worker.workspace = true

[dev-dependencies]
axum.workspace = true
reqwest.workspace = true
rustls.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
