<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 408" width="880" height="408" role="img" aria-label="fork: the mind&#x27;s history branches into a child mind per prompt. Each child shares the parent&#x27;s rows up to the fork, and gets a hand a1 of its own on a copy of a1&#x27;s directory. clone_hand: the same mind gets a second hand, a1-2, on a copy; release_hand lets it go and deletes the copy.">
  <title>fork and clone_hand</title>
  <style>
    svg {
      --bg: #f8f8fb; --frame: #e3e3ec; --panel: #f0f0f6; --surface: #ffffff;
      --ink: #1c1d2b; --muted: #5c5f73; --faint: #8e91a5; --line: #d0d2dd; --wire: #4a4d63;
      --mind: #6246d0; --mind-soft: #f0ecff; --mind-edge: #c6baf5;
      --hand: #bd4f0b; --hand-soft: #fff0e4; --hand-edge: #f1c29e;
      --model: #08776b; --model-soft: #e3f4f0; --model-edge: #9fd6cb;
      --ok: #1d7a39; --ok-soft: #e6f4ea; --ok-edge: #a7d8b4;
      --warn: #b3261e; --warn-soft: #fdeceb; --warn-edge: #f2b8b4;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0f1118; --frame: #262938; --panel: #141722; --surface: #1a1d29;
        --ink: #e8e9f1; --muted: #a2a5ba; --faint: #737790; --line: #353a4d; --wire: #b4b7ca;
        --mind: #ab98ff; --mind-soft: #1f1a38; --mind-edge: #4b3f95;
        --hand: #ff9f5e; --hand-soft: #2b1b0f; --hand-edge: #74401b;
        --model: #4fd3bc; --model-soft: #0f2824; --model-edge: #22635a;
        --ok: #5fd07c; --ok-soft: #10261a; --ok-edge: #245c35;
        --warn: #ff8a80; --warn-soft: #2f1416; --warn-edge: #7a2a2a;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 13px; fill: var(--ink); }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .title { font-size: 14px; font-weight: 600; }
    .sub { font-size: 12px; fill: var(--muted); }
    .lbl { font-size: 11.5px; fill: var(--muted); }
    .note { font-size: 11.5px; fill: var(--muted); font-style: italic; }
    .eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; fill: var(--faint); }
    .b { font-weight: 600; }
    .mind { fill: var(--mind); } .hand { fill: var(--hand); } .model { fill: var(--model); }
    .ok { fill: var(--ok); } .warn { fill: var(--warn); } .muted { fill: var(--muted); } .faint { fill: var(--faint); }
    .bg { fill: var(--bg); stroke: var(--frame); }
    .panel { fill: var(--panel); stroke: var(--line); }
    .slot { fill: none; stroke: var(--line); stroke-dasharray: 4 4; }
    .node { fill: var(--surface); stroke: var(--line); }
    .node.k-mind { stroke: var(--mind-edge); } .node.k-hand { stroke: var(--hand-edge); } .node.k-model { stroke: var(--model-edge); }
    .soft.k-mind { fill: var(--mind-soft); stroke: var(--mind-edge); }
    .soft.k-hand { fill: var(--hand-soft); stroke: var(--hand-edge); }
    .soft.k-model { fill: var(--model-soft); stroke: var(--model-edge); }
    .soft.k-ok { fill: var(--ok-soft); stroke: var(--ok-edge); }
    .soft.k-warn { fill: var(--warn-soft); stroke: var(--warn-edge); }
    .soft.k-plain { fill: var(--panel); stroke: var(--line); }
    .badge.k-mind { fill: var(--mind-soft); } .badge.k-hand { fill: var(--hand-soft); }
    .badge.k-model { fill: var(--model-soft); } .badge.k-plain { fill: var(--panel); }
    .ic { color: var(--muted); } .ic.k-mind { color: var(--mind); } .ic.k-hand { color: var(--hand); }
    .ic.k-model { color: var(--model); } .ic.k-warn { color: var(--warn); }
    .wire { fill: none; stroke: var(--wire); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .wire.k-mind { stroke: var(--mind); } .wire.k-hand { stroke: var(--hand); } .wire.k-model { stroke: var(--model); }
    .wire.k-warn { stroke: var(--warn); } .wire.k-faint { stroke: var(--faint); }
    .dash { stroke-dasharray: 5 4; }
    .dot { stroke-dasharray: 1 4; }
    .track { fill: none; stroke: var(--mind); stroke-width: 2.5; stroke-linecap: round; }
    .lane { fill: none; stroke: var(--hand); stroke-width: 1.5; stroke-linecap: round; }
    .life { fill: none; stroke: var(--line); stroke-width: 1.25; stroke-dasharray: 3 4; }
    .tick.p { fill: var(--faint); } .tick.s { fill: var(--mind); } .tick.o { fill: var(--hand); }
    .bar.k-mind { fill: var(--mind-soft); stroke: var(--mind); } .bar.k-hand { fill: var(--hand-soft); stroke: var(--hand); }
    .gem.k-mind { fill: var(--mind); } .gem.k-hand { fill: var(--hand); } .gem.k-warn { fill: var(--warn); }
    .gem.k-bg { fill: var(--bg); }
    .tip { fill: var(--wire); } .tip.k-mind { fill: var(--mind); } .tip.k-hand { fill: var(--hand); }
    .tip.k-model { fill: var(--model); } .tip.k-faint { fill: var(--faint); } .tip.k-warn { fill: var(--warn); }
  </style>
