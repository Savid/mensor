<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img" aria-label="A hand runs wherever its work is. On its own machine, mensor hand dials the mind in mensor serve over a WebSocket. In mensor run, the mind main and its hand local share one process and pass the messages in memory. On Cloudflare, a mind and its hand local share one Durable Object. Each hand says what it can do, and the messages are the same in every place: hello, call, result and ack.">
  <title>Where a hand runs</title>
  <style>
    svg {
      --bg: #f8f8fb; --frame: #e3e3ec; --panel: #f0f0f6; --surface: #ffffff;
      --ink: #1c1d2b; --muted: #5c5f73; --faint: #8e91a5; --line: #d0d2dd; --wire: #4a4d63;
      --mind: #6246d0; --mind-soft: #f0ecff; --mind-edge: #c6baf5;
      --hand: #ad4608; --hand-soft: #fff0e4; --hand-edge: #f1c29e;
      --model: #08776b; --model-soft: #e3f4f0; --model-edge: #9fd6cb;
      --ok: #1d7a39; --ok-soft: #e6f4ea; --ok-edge: #a7d8b4;
      --warn: #b3261e; --warn-soft: #fdeceb; --warn-edge: #f2b8b4;
      --shadow: rgba(28, 26, 58, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0f1118; --frame: #262938; --panel: #141722; --surface: #1a1d29;
        --ink: #e8e9f1; --muted: #a2a5ba; --faint: #737790; --line: #353a4d; --wire: #b4b7ca;
        --mind: #ab98ff; --mind-soft: #1f1a38; --mind-edge: #4b3f95;
        --hand: #ff9f5e; --hand-soft: #2b1b0f; --hand-edge: #74401b;
        --model: #4fd3bc; --model-soft: #0f2824; --model-edge: #22635a;
        --ok: #5fd07c; --ok-soft: #10261a; --ok-edge: #245c35;
        --warn: #ff8a80; --warn-soft: #2f1416; --warn-edge: #7a2a2a;
        --shadow: rgba(0, 0, 0, 0.4);
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 13px; fill: var(--ink); }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .title { font-size: 14px; font-weight: 600; }
    .sub { font-size: 12px; fill: var(--muted); }
    .lbl { font-size: 11.5px; fill: var(--muted); }
    .note { font-size: 11.5px; fill: var(--muted); font-style: italic; }
    .eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; fill: var(--muted); }
    .b { font-weight: 600; }
    .cap { font-size: 11px; }
    .mind { fill: var(--mind); } .hand { fill: var(--hand); } .model { fill: var(--model); }
    .ok { fill: var(--ok); } .warn { fill: var(--warn); } .muted { fill: var(--muted); } .faint { fill: var(--faint); }
    .bg { fill: var(--bg); stroke: var(--frame); }
    .panel { fill: var(--panel); stroke: var(--line); }
    .slot { fill: none; stroke: var(--line); stroke-dasharray: 4 4; }
    .node { fill: var(--surface); stroke: var(--line); }
    .node.k-mind { stroke: var(--mind-edge); } .node.k-hand { stroke: var(--hand-edge); } .node.k-model { stroke: var(--model-edge); }
    .soft.k-mind { fill: var(--mind-soft); stroke: var(--mind-edge); }
    .soft.k-hand { fill: var(--hand-soft); stroke: var(--hand-edge); }
    .soft.k-model { fill: var(--model-soft); stroke: var(--model-edge); }
    .soft.k-ok { fill: var(--ok-soft); stroke: var(--ok-edge); }
    .soft.k-warn { fill: var(--warn-soft); stroke: var(--warn-edge); }
    .soft.k-plain { fill: var(--panel); stroke: var(--line); }
    .badge.k-mind { fill: var(--mind-soft); } .badge.k-hand { fill: var(--hand-soft); }
    .badge.k-model { fill: var(--model-soft); } .badge.k-plain { fill: var(--panel); }
    .ic { color: var(--muted); } .ic.k-mind { color: var(--mind); } .ic.k-hand { color: var(--hand); }
    .ic.k-model { color: var(--model); } .ic.k-warn { color: var(--warn); }
    .wire { fill: none; stroke: var(--wire); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .wire.k-mind { stroke: var(--mind); } .wire.k-hand { stroke: var(--hand); } .wire.k-model { stroke: var(--model); }
    .wire.k-warn { stroke: var(--warn); } .wire.k-faint { stroke: var(--faint); }
    .dash { stroke-dasharray: 5 4; }
    .dot { stroke-dasharray: 1 4; }
    .track { fill: none; stroke: var(--mind); stroke-width: 2.5; stroke-linecap: round; }
    .lane { fill: none; stroke: var(--hand); stroke-width: 1.5; stroke-linecap: round; }
    .life { fill: none; stroke: var(--line); stroke-width: 1.25; stroke-dasharray: 3 4; }
    .tick.p { fill: var(--muted); } .tick.s { fill: var(--mind); } .tick.o { fill: var(--hand); }
    .bar.k-mind { fill: var(--mind-soft); stroke: var(--mind); } .bar.k-hand { fill: var(--hand-soft); stroke: var(--hand); }
    .gem.k-mind { fill: var(--mind); } .gem.k-hand { fill: var(--hand); } .gem.k-warn { fill: var(--warn); }
    .gem.k-bg { fill: var(--bg); }
    .shadow { flood-color: var(--shadow); }
    .tip { fill: var(--wire); } .tip.k-mind { fill: var(--mind); } .tip.k-hand { fill: var(--hand); }
    .tip.k-model { fill: var(--model); } .tip.k-faint { fill: var(--faint); } .tip.k-warn { fill: var(--warn); }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow class="shadow" dx="0" dy="1.5" stdDeviation="2"/>
    </filter>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="tip" d="M0,1 L9,5 L0,9 L2.6,5 Z"/></marker>
    <marker id="a-mind" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="tip k-mind" d="M0,1 L9,5 L0,9 L2.6,5 Z"/></marker>
    <marker id="a-hand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="tip k-hand" d="M0,1 L9,5 L0,9 L2.6,5 Z"/></marker>
    <marker id="a-model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="tip k-model" d="M0,1 L9,5 L0,9 L2.6,5 Z"/></marker>
    <marker id="a-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="tip k-faint" d="M0,1 L9,5 L0,9 L2.6,5 Z"/></marker>
    <marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="tip k-warn" d="M0,1 L9,5 L0,9 L2.6,5 Z"/></marker>
    <symbol id="i-mind" viewBox="-8 -8 16 16"><circle r="6.2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle r="2.6" fill="currentColor"/></symbol>
    <symbol id="i-hand" viewBox="-8 -8 16 16"><path d="M-5.5,-4 L-1.5,0 L-5.5,4 M0.5,4.5 L6,4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-model" viewBox="-8 -8 16 16"><path d="M0,-7 C0.9,-2 2,-0.9 7,0 C2,0.9 0.9,2 0,7 C-0.9,2 -2,0.9 -7,0 C-2,-0.9 -0.9,-2 0,-7 Z" fill="currentColor"/></symbol>
    <symbol id="i-store" viewBox="-8 -8 16 16"><g fill="none" stroke="currentColor" stroke-width="1.4"><ellipse cy="-4.5" rx="5.5" ry="2"/><path d="M-5.5,-4.5 V4.5 C-5.5,7.2 5.5,7.2 5.5,4.5 V-4.5"/><path d="M-5.5,0 C-5.5,2.6 5.5,2.6 5.5,0"/></g></symbol>
    <symbol id="i-you" viewBox="-8 -8 16 16"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cy="-3" r="3"/><path d="M-6,6.5 C-6,1.2 6,1.2 6,6.5"/></g></symbol>
    <symbol id="i-key" viewBox="-8 -8 16 16"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="-3" r="3.2"/><path d="M0.2,0 H6.5 M4.5,0 V2.8 M6.5,0 V2.2"/></g></symbol>
    <symbol id="i-worker" viewBox="-8 -8 16 16"><path d="M1.5,-7 L-4.5,1 H-0.2 L-1.5,7 L4.5,-1 H0.2 Z" fill="currentColor"/></symbol>
    <symbol id="i-alarm" viewBox="-8 -8 16 16"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle r="6"/><path d="M0,-3.5 V0 L2.6,1.8"/></g></symbol>
    <symbol id="i-cut" viewBox="-8 -8 16 16"><path d="M-4,-4 L4,4 M4,-4 L-4,4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="879" height="459" rx="16"/>

  <!-- its own machine -->
  <text x="28" y="40" class="eyebrow">ITS OWN MACHINE</text>
  <text x="28" y="58" class="lbl mono">mensor serve  +  mensor hand</text>
  <rect class="panel" x="28" y="72" width="264" height="92" rx="12"/>
  <text x="44" y="92" class="lbl">the host</text>
  <rect class="panel" x="28" y="236" width="264" height="108" rx="12"/>
  <text x="44" y="256" class="lbl">a machine or VM</text>
  <text x="28" y="366" class="note">or your own program, in any language</text>
  <rect class="node k-mind" x="44" y="102" width="232" height="48" rx="10" filter="url(#lift)"/>
  <circle class="badge k-mind" cx="70" cy="126.0" r="13"/>
  <use href="#i-mind" class="ic k-mind" x="62" y="118" width="16" height="16"/>
  <text x="92" y="131.0" class="title">mind <tspan class="mono mind">m</tspan></text>
  <rect class="node k-hand" x="44" y="262" width="232" height="62" rx="10" filter="url(#lift)"/>
  <circle class="badge k-hand" cx="66" cy="281" r="11"/>
  <use href="#i-hand" class="ic k-hand" x="58" y="273" width="16" height="16"/>
  <text x="84" y="286" class="title">hand <tspan class="mono hand">a1</tspan></text>
  <rect class="soft k-plain" x="56" y="296" width="65" height="18" rx="9"/>
  <text x="88.5" y="309.0" class="mono cap plain" text-anchor="middle">commands</text>
  <rect class="soft k-plain" x="126" y="296" width="45" height="18" rx="9"/>
  <text x="148.5" y="309.0" class="mono cap plain" text-anchor="middle">files</text>
  <rect class="soft k-plain" x="176" y="296" width="45" height="18" rx="9"/>
  <text x="198.5" y="309.0" class="mono cap plain" text-anchor="middle">clone</text>
  <path class="wire k-hand" d="M152,150 L152,262" marker-end="url(#a-hand)"/>
  <path class="wire k-hand" d="M168,262 L168,150" marker-end="url(#a-hand)"/>
  <text x="144" y="184" class="lbl mono" text-anchor="end">call</text>
  <text x="176" y="184" class="lbl mono">result</text>
  <rect class="soft k-plain" x="122.0" y="200" width="76" height="22" rx="11"/>
  <text x="160" y="215" class="lbl" text-anchor="middle">WebSocket</text>

  <!-- the host's process -->
  <text x="308" y="40" class="eyebrow">THE HOST'S PROCESS</text>
  <text x="308" y="58" class="lbl mono">mensor run</text>
  <rect class="panel" x="308" y="72" width="264" height="272" rx="12"/>
  <text x="324" y="92" class="lbl">one process</text>
  <rect class="node k-mind" x="324" y="102" width="232" height="48" rx="10" filter="url(#lift)"/>
  <circle class="badge k-mind" cx="350" cy="126.0" r="13"/>
  <use href="#i-mind" class="ic k-mind" x="342" y="118" width="16" height="16"/>
  <text x="372" y="131.0" class="title">mind <tspan class="mono mind">main</tspan></text>
  <rect class="node k-hand" x="324" y="262" width="232" height="62" rx="10" filter="url(#lift)"/>
  <circle class="badge k-hand" cx="346" cy="281" r="11"/>
  <use href="#i-hand" class="ic k-hand" x="338" y="273" width="16" height="16"/>
  <text x="364" y="286" class="title">hand <tspan class="mono hand">local</tspan></text>
  <rect class="soft k-plain" x="336" y="296" width="65" height="18" rx="9"/>
  <text x="368.5" y="309.0" class="mono cap plain" text-anchor="middle">commands</text>
  <rect class="soft k-plain" x="406" y="296" width="45" height="18" rx="9"/>
  <text x="428.5" y="309.0" class="mono cap plain" text-anchor="middle">files</text>
  <rect class="soft k-plain" x="456" y="296" width="45" height="18" rx="9"/>
  <text x="478.5" y="309.0" class="mono cap plain" text-anchor="middle">clone</text>
  <path class="wire k-hand" d="M432,150 L432,262" marker-end="url(#a-hand)"/>
  <path class="wire k-hand" d="M448,262 L448,150" marker-end="url(#a-hand)"/>
  <text x="424" y="184" class="lbl mono" text-anchor="end">call</text>
  <text x="456" y="184" class="lbl mono">result</text>
  <rect class="soft k-plain" x="402.0" y="200" width="76" height="22" rx="11"/>
  <text x="440" y="215" class="lbl" text-anchor="middle">in memory</text>

  <!-- a durable object -->
  <text x="588" y="40" class="eyebrow">A DURABLE OBJECT</text>
  <text x="588" y="58" class="lbl mono">Cloudflare</text>
  <rect class="panel" x="588" y="72" width="264" height="272" rx="12"/>
  <text x="604" y="92" class="lbl">one object</text>
  <rect class="node k-mind" x="604" y="102" width="232" height="48" rx="10" filter="url(#lift)"/>
  <circle class="badge k-mind" cx="630" cy="126.0" r="13"/>
  <use href="#i-mind" class="ic k-mind" x="622" y="118" width="16" height="16"/>
  <text x="652" y="131.0" class="title">mind <tspan class="mono mind">m</tspan></text>
  <rect class="node k-hand" x="604" y="262" width="232" height="62" rx="10" filter="url(#lift)"/>
  <circle class="badge k-hand" cx="626" cy="281" r="11"/>
  <use href="#i-hand" class="ic k-hand" x="618" y="273" width="16" height="16"/>
  <text x="644" y="286" class="title">hand <tspan class="mono hand">local</tspan></text>
  <rect class="soft k-plain" x="616" y="296" width="45" height="18" rx="9"/>
  <text x="638.5" y="309.0" class="mono cap plain" text-anchor="middle">files</text>
  <rect class="soft k-plain" x="666" y="296" width="45" height="18" rx="9"/>
  <text x="688.5" y="309.0" class="mono cap plain" text-anchor="middle">fetch</text>
  <path class="wire k-hand" d="M712,150 L712,262" marker-end="url(#a-hand)"/>
  <path class="wire k-hand" d="M728,262 L728,150" marker-end="url(#a-hand)"/>
  <text x="704" y="184" class="lbl mono" text-anchor="end">call</text>
  <text x="736" y="184" class="lbl mono">result</text>
  <rect class="soft k-plain" x="682.0" y="200" width="76" height="22" rx="11"/>
  <text x="720" y="215" class="lbl" text-anchor="middle">in memory</text>

  <!-- The same messages in every place -->
  <rect class="node" x="28" y="388" width="824" height="52" rx="12"/>
  <text x="48" y="418" class="eyebrow">THE SAME MESSAGES</text>
  <rect class="soft k-hand" x="190" y="404" width="49" height="20" rx="10"/>
  <text x="214.5" y="418.0" class="mono hand" text-anchor="middle">hello</text>
  <text x="246" y="418" class="lbl">its name and what it can do</text>
  <rect class="soft k-mind" x="415" y="404" width="42" height="20" rx="10"/>
  <text x="436.0" y="418.0" class="mono mind" text-anchor="middle">call</text>
  <text x="464" y="418" class="lbl">do one thing</text>
  <rect class="soft k-hand" x="549" y="404" width="56" height="20" rx="10"/>
  <text x="577.0" y="418.0" class="mono hand" text-anchor="middle">result</text>
  <text x="612" y="418" class="lbl">what it gave</text>
  <rect class="soft k-mind" x="697" y="404" width="35" height="20" rx="10"/>
  <text x="714.5" y="418.0" class="mono mind" text-anchor="middle">ack</text>
  <text x="739" y="418" class="lbl">stored, forget it</text>
</svg>
