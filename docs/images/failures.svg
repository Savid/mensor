<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 376" width="880" height="376" role="img" aria-label="What happens when something fails. A connection drops: the hand holds the result, and the mind gets it when the hand reconnects. A hand restarts mid-call: the call&#x27;s outcome is unknown, and the model is told to check. A hand is away: the call waits, and is sent when the hand is back. A hand dies: release it, its call is unknown, and the turn goes on. An interrupt: a running call is cancelled, and one not yet sent does not run. The host stops mid-fork: the children are made first, so the fork completes once.">
  <title>When something fails</title>
  <style>
    svg {
      --bg: #f8f8fb; --frame: #e3e3ec; --panel: #f0f0f6; --surface: #ffffff;
      --ink: #1c1d2b; --muted: #5c5f73; --faint: #8e91a5; --line: #d0d2dd; --wire: #4a4d63;
      --mind: #6246d0; --mind-soft: #f0ecff; --mind-edge: #c6baf5;
      --hand: #ad4608; --hand-soft: #fff0e4; --hand-edge: #f1c29e;
      --model: #08776b; --model-soft: #e3f4f0; --model-edge: #9fd6cb;
      --ok: #1d7a39; --ok-soft: #e6f4ea; --ok-edge: #a7d8b4;
      --warn: #b3261e; --warn-soft: #fdeceb; --warn-edge: #f2b8b4;
      --shadow: rgba(28, 26, 58, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0f1118; --frame: #262938; --panel: #141722; --surface: #1a1d29;
        --ink: #e8e9f1; --muted: #a2a5ba; --faint: #737790; --line: #353a4d; --wire: #b4b7ca;
        --mind: #ab98ff; --mind-soft: #1f1a38; --mind-edge: #4b3f95;
        --hand: #ff9f5e; --hand-soft: #2b1b0f; --hand-edge: #74401b;
        --model: #4fd3bc; --model-soft: #0f2824; --model-edge: #22635a;
        --ok: #5fd07c; --ok-soft: #10261a; --ok-edge: #245c35;
        --warn: #ff8a80; --warn-soft: #2f1416; --warn-edge: #7a2a2a;
        --shadow: rgba(0, 0, 0, 0.4);
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 13px; fill: var(--ink); }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .title { font-size: 14px; font-weight: 600; }
    .sub { font-size: 12px; fill: var(--muted); }
    .lbl { font-size: 11.5px; fill: var(--muted); }
    .note { font-size: 11.5px; fill: var(--muted); font-style: italic; }
    .eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; fill: var(--muted); }
    .b { font-weight: 600; }
    .cap { font-size: 11px; }
    .mind { fill: var(--mind); } .hand { fill: var(--hand); } .model { fill: var(--model); }
    .ok { fill: var(--ok); } .warn { fill: var(--warn); } .muted { fill: var(--muted); } .faint { fill: var(--faint); }
    .bg { fill: var(--bg); stroke: var(--frame); }
    .panel { fill: var(--panel); stroke: var(--line); }
    .slot { fill: none; stroke: var(--line); stroke-dasharray: 4 4; }
    .node { fill: var(--surface); stroke: var(--line); }
    .node.k-mind { stroke: var(--mind-edge); } .node.k-hand { stroke: var(--hand-edge); } .node.k-model { stroke: var(--model-edge); }
    .soft.k-mind { fill: var(--mind-soft); stroke: var(--mind-edge); }
    .soft.k-hand { fill: var(--hand-soft); stroke: var(--hand-edge); }
    .soft.k-model { fill: var(--model-soft); stroke: var(--model-edge); }
    .soft.k-ok { fill: var(--ok-soft); stroke: var(--ok-edge); }
    .soft.k-warn { fill: var(--warn-soft); stroke: var(--warn-edge); }
    .soft.k-plain { fill: var(--panel); stroke: var(--line); }
    .badge.k-mind { fill: var(--mind-soft); } .badge.k-hand { fill: var(--hand-soft); }
    .badge.k-model { fill: var(--model-soft); } .badge.k-plain { fill: var(--panel); }
    .ic { color: var(--muted); } .ic.k-mind { color: var(--mind); } .ic.k-hand { color: var(--hand); }
    .ic.k-model { color: var(--model); } .ic.k-warn { color: var(--warn); }
    .wire { fill: none; stroke: var(--wire); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .wire.k-mind { stroke: var(--mind); } .wire.k-hand { stroke: var(--hand); } .wire.k-model { stroke: var(--model); }
    .wire.k-warn { stroke: var(--warn); } .wire.k-faint { stroke: var(--faint); }
    .dash { stroke-dasharray: 5 4; }
    .dot { stroke-dasharray: 1 4; }
    .track { fill: none; stroke: var(--mind); stroke-width: 2.5; stroke-linecap: round; }
    .lane { fill: none; stroke: var(--hand); stroke-width: 1.5; stroke-linecap: round; }
    .life { fill: none; stroke: var(--line); stroke-width: 1.25; stroke-dasharray: 3 4; }
    .tick.p { fill: var(--muted); } .tick.s { fill: var(--mind); } .tick.o { fill: var(--hand); }
    .bar.k-mind { fill: var(--mind-soft); stroke: var(--mind); } .bar.k-hand { fill: var(--hand-soft); stroke: var(--hand); }
    .gem.k-mind { fill: var(--mind); } .gem.k-hand { fill: var(--hand); } .gem.k-warn { fill: var(--warn); }
    .gem.k-bg { fill: var(--bg); } .gem.k-ok { fill: var(--ok); }
    .hollow { fill: var(--surface); stroke: var(--hand); stroke-width: 1.5; }
    .cover { fill: var(--surface); }
    .pill { font-size: 12px; font-weight: 600; }
    .shadow { flood-color: var(--shadow); }
    .tip { fill: var(--wire); } .tip.k-mind { fill: var(--mind); } .tip.k-hand { fill: var(--hand); }
    .tip.k-model { fill: var(--model); } .tip.k-faint { fill: var(--faint); } .tip.k-warn { fill: var(--warn); }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow class="shadow" dx="0" dy="1.5" stdDeviation="2"/>
    </filter>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="tip" d="M0,1 L9,5 L0,9 L2.6,5 Z"/></marker>
    <marker id="a-mind" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="tip k-mind" d="M0,1 L9,5 L0,9 L2.6,5 Z"/></marker>
    <marker id="a-hand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="tip k-hand" d="M0,1 L9,5 L0,9 L2.6,5 Z"/></marker>
    <marker id="a-model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="tip k-model" d="M0,1 L9,5 L0,9 L2.6,5 Z"/></marker>
    <marker id="a-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="tip k-faint" d="M0,1 L9,5 L0,9 L2.6,5 Z"/></marker>
    <marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="tip k-warn" d="M0,1 L9,5 L0,9 L2.6,5 Z"/></marker>
    <symbol id="i-mind" viewBox="-8 -8 16 16"><circle r="6.2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle r="2.6" fill="currentColor"/></symbol>
    <symbol id="i-hand" viewBox="-8 -8 16 16"><path d="M-5.5,-4 L-1.5,0 L-5.5,4 M0.5,4.5 L6,4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-model" viewBox="-8 -8 16 16"><path d="M0,-7 C0.9,-2 2,-0.9 7,0 C2,0.9 0.9,2 0,7 C-0.9,2 -2,0.9 -7,0 C-2,-0.9 -0.9,-2 0,-7 Z" fill="currentColor"/></symbol>
    <symbol id="i-store" viewBox="-8 -8 16 16"><g fill="none" stroke="currentColor" stroke-width="1.4"><ellipse cy="-4.5" rx="5.5" ry="2"/><path d="M-5.5,-4.5 V4.5 C-5.5,7.2 5.5,7.2 5.5,4.5 V-4.5"/><path d="M-5.5,0 C-5.5,2.6 5.5,2.6 5.5,0"/></g></symbol>
    <symbol id="i-you" viewBox="-8 -8 16 16"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cy="-3" r="3"/><path d="M-6,6.5 C-6,1.2 6,1.2 6,6.5"/></g></symbol>
    <symbol id="i-key" viewBox="-8 -8 16 16"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="-3" r="3.2"/><path d="M0.2,0 H6.5 M4.5,0 V2.8 M6.5,0 V2.2"/></g></symbol>
    <symbol id="i-worker" viewBox="-8 -8 16 16"><path d="M1.5,-7 L-4.5,1 H-0.2 L-1.5,7 L4.5,-1 H0.2 Z" fill="currentColor"/></symbol>
    <symbol id="i-alarm" viewBox="-8 -8 16 16"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle r="6"/><path d="M0,-3.5 V0 L2.6,1.8"/></g></symbol>
    <symbol id="i-cut" viewBox="-8 -8 16 16"><path d="M-4,-4 L4,4 M4,-4 L-4,4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="879" height="375" rx="16"/>

  <!-- A connection drops -->
  <rect class="node" x="28" y="24" width="264" height="156" rx="12"/>
  <text x="48" y="54" class="title">A connection drops</text>
  <path class="wire k-hand" d="M60,86 L160,86"/>
  <path class="wire k-hand dash" d="M160,86 L260,86"/>
  <rect class="gem k-hand" x="55" y="81" width="10" height="10" rx="1.5" transform="rotate(45 60 86)"/>
  <text x="60" y="110" class="lbl" text-anchor="middle">call</text>
  <circle class="cover" cx="160" cy="86" r="9"/>
  <use href="#i-cut" class="ic k-warn" x="153" y="79" width="14" height="14"/>
  <text x="160" y="110" class="lbl" text-anchor="middle">drops</text>
  <rect class="gem k-ok" x="255" y="81" width="10" height="10" rx="1.5" transform="rotate(45 260 86)"/>
  <text x="260" y="110" class="lbl" text-anchor="middle">reconnects</text>
  <rect class="soft k-ok" x="48" y="124" width="93" height="22" rx="11"/>
  <text x="94.5" y="139.0" class="pill ok" text-anchor="middle">result kept</text>
  <text x="48" y="166" class="lbl">the hand holds it until it is stored</text>

  <!-- A hand restarts -->
  <rect class="node" x="308" y="24" width="264" height="156" rx="12"/>
  <text x="328" y="54" class="title">A hand restarts</text>
  <path class="wire k-hand" d="M340,86 L440,86"/>
  <path class="wire k-hand dash" d="M440,86 L540,86"/>
  <rect class="gem k-hand" x="335" y="81" width="10" height="10" rx="1.5" transform="rotate(45 340 86)"/>
  <text x="340" y="110" class="lbl" text-anchor="middle">call</text>
  <circle class="cover" cx="440" cy="86" r="9"/>
  <use href="#i-cut" class="ic k-warn" x="433" y="79" width="14" height="14"/>
  <text x="440" y="110" class="lbl" text-anchor="middle">restarts</text>
  <rect class="gem k-warn" x="535" y="81" width="10" height="10" rx="1.5" transform="rotate(45 540 86)"/>
  <text x="540" y="110" class="lbl" text-anchor="middle">new boot</text>
  <rect class="soft k-warn" x="328" y="124" width="178" height="22" rx="11"/>
  <text x="417.0" y="139.0" class="pill warn" text-anchor="middle">unknown: it may have run</text>
  <text x="328" y="166" class="lbl">the model is told to check</text>

  <!-- A hand is away -->
  <rect class="node" x="588" y="24" width="264" height="156" rx="12"/>
  <text x="608" y="54" class="title">A hand is away</text>
  <path class="wire k-hand dash" d="M620,86 L720,86"/>
  <path class="wire k-hand" d="M720,86 L820,86"/>
  <circle class="hollow" cx="620" cy="86" r="5"/>
  <text x="620" y="110" class="lbl" text-anchor="middle">tool use</text>
  <rect class="gem k-hand" x="715" y="81" width="10" height="10" rx="1.5" transform="rotate(45 720 86)"/>
  <text x="720" y="110" class="lbl" text-anchor="middle">back</text>
  <rect class="gem k-ok" x="815" y="81" width="10" height="10" rx="1.5" transform="rotate(45 820 86)"/>
  <text x="820" y="110" class="lbl" text-anchor="middle">result</text>
  <rect class="soft k-ok" x="608" y="124" width="152" height="22" rx="11"/>
  <text x="684.0" y="139.0" class="pill ok" text-anchor="middle">sent when it is back</text>
  <text x="608" y="166" class="lbl">other hands keep working</text>

  <!-- A hand dies -->
  <rect class="node" x="28" y="196" width="264" height="156" rx="12"/>
  <text x="48" y="226" class="title">A hand dies</text>
  <path class="wire k-hand" d="M60,258 L160,258"/>
  <path class="wire k-hand dash" d="M160,258 L260,258"/>
  <rect class="gem k-hand" x="55" y="253" width="10" height="10" rx="1.5" transform="rotate(45 60 258)"/>
  <text x="60" y="282" class="lbl" text-anchor="middle">call</text>
  <circle class="cover" cx="160" cy="258" r="9"/>
  <use href="#i-cut" class="ic k-warn" x="153" y="251" width="14" height="14"/>
  <text x="160" y="282" class="lbl" text-anchor="middle">dies</text>
  <rect class="gem k-warn" x="255" y="253" width="10" height="10" rx="1.5" transform="rotate(45 260 258)"/>
  <text x="260" y="282" class="lbl" text-anchor="middle">released</text>
  <rect class="soft k-warn" x="48" y="296" width="178" height="22" rx="11"/>
  <text x="137.0" y="311.0" class="pill warn" text-anchor="middle">unknown: it may have run</text>
  <text x="48" y="338" class="lbl">release it, and the turn goes on</text>

  <!-- An interrupt -->
  <rect class="node" x="308" y="196" width="264" height="156" rx="12"/>
  <text x="328" y="226" class="title">An interrupt</text>
  <path class="wire k-hand" d="M340,258 L440,258"/>
  <path class="wire k-hand" d="M440,258 L540,258"/>
  <rect class="gem k-hand" x="335" y="253" width="10" height="10" rx="1.5" transform="rotate(45 340 258)"/>
  <text x="340" y="282" class="lbl" text-anchor="middle">call</text>
  <circle class="cover" cx="440" cy="258" r="9"/>
  <use href="#i-cut" class="ic k-warn" x="433" y="251" width="14" height="14"/>
  <text x="440" y="282" class="lbl" text-anchor="middle">interrupt</text>
  <rect class="gem k-warn" x="535" y="253" width="10" height="10" rx="1.5" transform="rotate(45 540 258)"/>
  <text x="540" y="282" class="lbl" text-anchor="middle">cancelled</text>
  <rect class="soft k-plain" x="328" y="296" width="159" height="22" rx="11"/>
  <text x="407.5" y="311.0" class="pill plain" text-anchor="middle">cancelled, or not run</text>
  <text x="328" y="338" class="lbl">a call not yet sent never starts</text>

  <!-- The host stops mid-fork -->
  <rect class="node" x="588" y="196" width="264" height="156" rx="12"/>
  <text x="608" y="226" class="title">The host stops mid-fork</text>
  <path class="wire k-mind" d="M620,258 L720,258"/>
  <path class="wire k-mind dash" d="M720,258 L820,258"/>
  <rect class="gem k-mind" x="615" y="253" width="10" height="10" rx="1.5" transform="rotate(45 620 258)"/>
  <text x="620" y="282" class="lbl" text-anchor="middle">children</text>
  <circle class="cover" cx="720" cy="258" r="9"/>
  <use href="#i-cut" class="ic k-warn" x="713" y="251" width="14" height="14"/>
  <text x="720" y="282" class="lbl" text-anchor="middle">host stops</text>
  <rect class="gem k-ok" x="815" y="253" width="10" height="10" rx="1.5" transform="rotate(45 820 258)"/>
  <text x="820" y="282" class="lbl" text-anchor="middle">restarts</text>
  <rect class="soft k-ok" x="608" y="296" width="93" height="22" rx="11"/>
  <text x="654.5" y="311.0" class="pill ok" text-anchor="middle">forked once</text>
  <text x="608" y="338" class="lbl">a child is made before the fork is stored</text>
</svg>
