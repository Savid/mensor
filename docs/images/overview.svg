<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" role="img" aria-label="You prompt a mind over HTTP. The mind, in the host mensor serve, holds the history, calls the model and stores every item. The model sees two kinds of tools. Hand tools are what the mind&#x27;s hands say they can do, and each runs on a hand as a call. The mind&#x27;s own tools act on the mind: tell and wait reach its parent and children with no hand, fork and clone_hand have a hand clone itself, and release_hand lets one go. Each hand dials in from wherever it runs.">
  <title>mensor: a mind and its hands</title>
  <style>
    svg {
      --bg: #f8f8fb; --frame: #e3e3ec; --panel: #f0f0f6; --surface: #ffffff;
      --ink: #1c1d2b; --muted: #5c5f73; --faint: #8e91a5; --line: #d0d2dd; --wire: #4a4d63;
      --mind: #6246d0; --mind-soft: #f0ecff; --mind-edge: #c6baf5;
      --hand: #ad4608; --hand-soft: #fff0e4; --hand-edge: #f1c29e;
      --model: #08776b; --model-soft: #e3f4f0; --model-edge: #9fd6cb;
      --ok: #1d7a39; --ok-soft: #e6f4ea; --ok-edge: #a7d8b4;
      --warn: #b3261e; --warn-soft: #fdeceb; --warn-edge: #f2b8b4;
      --shadow: rgba(28, 26, 58, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0f1118; --frame: #262938; --panel: #141722; --surface: #1a1d29;
        --ink: #e8e9f1; --muted: #a2a5ba; --faint: #737790; --line: #353a4d; --wire: #b4b7ca;
        --mind: #ab98ff; --mind-soft: #1f1a38; --mind-edge: #4b3f95;
        --hand: #ff9f5e; --hand-soft: #2b1b0f; --hand-edge: #74401b;
        --model: #4fd3bc; --model-soft: #0f2824; --model-edge: #22635a;
        --ok: #5fd07c; --ok-soft: #10261a; --ok-edge: #245c35;
        --warn: #ff8a80; --warn-soft: #2f1416; --warn-edge: #7a2a2a;
        --shadow: rgba(0, 0, 0, 0.4);
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 13px; fill: var(--ink); }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .title { font-size: 14px; font-weight: 600; }
    .sub { font-size: 12px; fill: var(--muted); }
    .lbl { font-size: 11.5px; fill: var(--muted); }
    .note { font-size: 11.5px; fill: var(--muted); font-style: italic; }
    .eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; fill: var(--muted); }
    .b { font-weight: 600; }
    .cap { font-size: 11px; }
    .mind { fill: var(--mind); } .hand { fill: var(--hand); } .model { fill: var(--model); }
    .ok { fill: var(--ok); } .warn { fill: var(--warn); } .muted { fill: var(--muted); } .faint { fill: var(--faint); }
    .bg { fill: var(--bg); stroke: var(--frame); }
    .panel { fill: var(--panel); stroke: var(--line); }
    .slot { fill: none; stroke: var(--line); stroke-dasharray: 4 4; }
    .node { fill: var(--surface); stroke: var(--line); }
    .node.k-mind { stroke: var(--mind-edge); } .node.k-hand { stroke: var(--hand-edge); } .node.k-model { stroke: var(--model-edge); }
    .soft.k-mind { fill: var(--mind-soft); stroke: var(--mind-edge); }
    .soft.k-hand { fill: var(--hand-soft); stroke: var(--hand-edge); }
    .soft.k-model { fill: var(--model-soft); stroke: var(--model-edge); }
    .soft.k-ok { fill: var(--ok-soft); stroke: var(--ok-edge); }
    .soft.k-warn { fill: var(--warn-soft); stroke: var(--warn-edge); }
    .soft.k-plain { fill: var(--panel); stroke: var(--line); }
    .badge.k-mind { fill: var(--mind-soft); } .badge.k-hand { fill: var(--hand-soft); }
    .badge.k-model { fill: var(--model-soft); } .badge.k-plain { fill: var(--panel); }
    .ic { color: var(--muted); } .ic.k-mind { color: var(--mind); } .ic.k-hand { color: var(--hand); }
    .ic.k-model { color: var(--model); } .ic.k-warn { color: var(--warn); }
    .wire { fill: none; stroke: var(--wire); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .wire.k-mind { stroke: var(--mind); } .wire.k-hand { stroke: var(--hand); } .wire.k-model { stroke: var(--model); }
    .wire.k-warn { stroke: var(--warn); } .wire.k-faint { stroke: var(--faint); }
    .dash { stroke-dasharray: 5 4; }
    .dot { stroke-dasharray: 1 4; }
    .track { fill: none; stroke: var(--mind); stroke-width: 2.5; stroke-linecap: round; }
    .lane { fill: none; stroke: var(--hand); stroke-width: 1.5; stroke-linecap: round; }
    .life { fill: none; stroke: var(--line); stroke-width: 1.25; stroke-dasharray: 3 4; }
    .tick.p { fill: var(--muted); } .tick.s { fill: var(--mind); } .tick.o { fill: var(--hand); }
    .bar.k-mind { fill: var(--mind-soft); stroke: var(--mind); } .bar.k-hand { fill: var(--hand-soft); stroke: var(--hand); }
    .gem.k-mind { fill: var(--mind); } .gem.k-hand { fill: var(--hand); } .gem.k-warn { fill: var(--warn); }
    .gem.k-bg { fill: var(--bg); }
    .shadow { flood-color: var(--shadow); }
    .tip { fill: var(--wire); } .tip.k-mind { fill: var(--mind); } .tip.k-hand { fill: var(--hand); }
    .tip.k-model { fill: var(--model); } .tip.k-faint { fill: var(--faint); } .tip.k-warn { fill: var(--warn); }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow class="shadow" dx="0" dy="1.5" stdDeviation="2"/>
    </filter>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="tip" d="M0,1 L9,5 L0,9 L2.6,5 Z"/></marker>
    <marker id="a-mind" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="tip k-mind" d="M0,1 L9,5 L0,9 L2.6,5 Z"/></marker>
    <marker id="a-hand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="tip k-hand" d="M0,1 L9,5 L0,9 L2.6,5 Z"/></marker>
    <marker id="a-model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="tip k-model" d="M0,1 L9,5 L0,9 L2.6,5 Z"/></marker>
    <marker id="a-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="tip k-faint" d="M0,1 L9,5 L0,9 L2.6,5 Z"/></marker>
    <marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="tip k-warn" d="M0,1 L9,5 L0,9 L2.6,5 Z"/></marker>
    <symbol id="i-mind" viewBox="-8 -8 16 16"><circle r="6.2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle r="2.6" fill="currentColor"/></symbol>
    <symbol id="i-hand" viewBox="-8 -8 16 16"><path d="M-5.5,-4 L-1.5,0 L-5.5,4 M0.5,4.5 L6,4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-model" viewBox="-8 -8 16 16"><path d="M0,-7 C0.9,-2 2,-0.9 7,0 C2,0.9 0.9,2 0,7 C-0.9,2 -2,0.9 -7,0 C-2,-0.9 -0.9,-2 0,-7 Z" fill="currentColor"/></symbol>
    <symbol id="i-store" viewBox="-8 -8 16 16"><g fill="none" stroke="currentColor" stroke-width="1.4"><ellipse cy="-4.5" rx="5.5" ry="2"/><path d="M-5.5,-4.5 V4.5 C-5.5,7.2 5.5,7.2 5.5,4.5 V-4.5"/><path d="M-5.5,0 C-5.5,2.6 5.5,2.6 5.5,0"/></g></symbol>
    <symbol id="i-you" viewBox="-8 -8 16 16"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cy="-3" r="3"/><path d="M-6,6.5 C-6,1.2 6,1.2 6,6.5"/></g></symbol>
    <symbol id="i-key" viewBox="-8 -8 16 16"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="-3" r="3.2"/><path d="M0.2,0 H6.5 M4.5,0 V2.8 M6.5,0 V2.2"/></g></symbol>
    <symbol id="i-worker" viewBox="-8 -8 16 16"><path d="M1.5,-7 L-4.5,1 H-0.2 L-1.5,7 L4.5,-1 H0.2 Z" fill="currentColor"/></symbol>
    <symbol id="i-alarm" viewBox="-8 -8 16 16"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle r="6"/><path d="M0,-3.5 V0 L2.6,1.8"/></g></symbol>
    <symbol id="i-cut" viewBox="-8 -8 16 16"><path d="M-4,-4 L4,4 M4,-4 L-4,4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="879" height="579" rx="16"/>

  <!-- The model's API, above the host -->
  <rect class="node k-model" x="260" y="32" width="248" height="56" rx="10" filter="url(#lift)"/>
  <circle class="badge k-model" cx="286" cy="60.0" r="13"/>
  <use href="#i-model" class="ic k-model" x="278" y="52" width="16" height="16"/>
  <text x="308" y="57.0" class="title">model API</text>
  <text x="308" y="74.0" class="sub">Messages · Chat · Responses</text>
  <text x="360" y="112" class="lbl" text-anchor="end">request</text>
  <text x="408" y="112" class="lbl">stream</text>

  <!-- The host, which holds the model's key -->
  <rect class="panel" x="184" y="120" width="664" height="304" rx="14"/>
  <text x="204" y="144" class="lbl mono">mensor serve</text>
  <use href="#i-key" class="ic" x="430" y="132" width="16" height="16"/>
  <text x="450" y="144" class="lbl">holds the model's key</text>

  <!-- The mind, and the two kinds of tool its model sees -->
  <rect class="node k-mind" x="208" y="156" width="352" height="244" rx="12" filter="url(#lift)"/>
  <path class="wire k-model" d="M368,156 L368,88" marker-end="url(#a-model)"/>
  <path class="wire k-model" d="M400,88 L400,156" marker-end="url(#a-model)"/>
  <circle class="badge k-mind" cx="234" cy="183" r="13"/>
  <use href="#i-mind" class="ic k-mind" x="226" y="175" width="16" height="16"/>
  <text x="256" y="188" class="title">mind <tspan class="mono mind">m</tspan></text>
  <text x="256" y="205" class="sub">holds the history and calls the model</text>
  <text x="228" y="238" class="eyebrow">HAND TOOLS  ·  RUN ON A HAND</text>
  <rect class="soft k-hand" x="228" y="246" width="42" height="20" rx="10"/>
  <text x="249.0" y="260.0" class="mono hand" text-anchor="middle">bash</text>
  <rect class="soft k-hand" x="276" y="246" width="42" height="20" rx="10"/>
  <text x="297.0" y="260.0" class="mono hand" text-anchor="middle">read</text>
  <rect class="soft k-hand" x="324" y="246" width="49" height="20" rx="10"/>
  <text x="348.5" y="260.0" class="mono hand" text-anchor="middle">write</text>
  <rect class="soft k-hand" x="379" y="246" width="42" height="20" rx="10"/>
  <text x="400.0" y="260.0" class="mono hand" text-anchor="middle">edit</text>
  <rect class="soft k-hand" x="427" y="246" width="42" height="20" rx="10"/>
  <text x="448.0" y="260.0" class="mono hand" text-anchor="middle">list</text>
  <text x="228" y="284" class="lbl">whatever its hands say they can do</text>
  <text x="228" y="312" class="eyebrow">ITS OWN TOOLS</text>
  <rect class="soft k-mind" x="228" y="320" width="42" height="20" rx="10"/>
  <text x="249.0" y="334.0" class="mono mind" text-anchor="middle">tell</text>
  <rect class="soft k-mind" x="276" y="320" width="42" height="20" rx="10"/>
  <text x="297.0" y="334.0" class="mono mind" text-anchor="middle">wait</text>
  <text x="372" y="334" class="lbl">parent and children · no hand</text>
  <rect class="soft k-mind" x="228" y="346" width="42" height="20" rx="10"/>
  <text x="249.0" y="360.0" class="mono mind" text-anchor="middle">fork</text>
  <rect class="soft k-mind" x="276" y="346" width="84" height="20" rx="10"/>
  <text x="318.0" y="360.0" class="mono mind" text-anchor="middle">clone_hand</text>
  <text x="372" y="360" class="lbl">a hand clones itself</text>
  <rect class="soft k-mind" x="228" y="372" width="98" height="20" rx="10"/>
  <text x="277.0" y="386.0" class="mono mind" text-anchor="middle">release_hand</text>
  <text x="372" y="386" class="lbl">a hand is let go</text>

  <!-- Beside it in the host: its store -->
  <rect class="node k-plain" x="664" y="150" width="168" height="56" rx="10" filter="url(#lift)"/>
  <circle class="badge k-plain" cx="690" cy="178.0" r="13"/>
  <use href="#i-store" class="ic" x="682" y="170" width="16" height="16"/>
  <text x="712" y="175.0" class="title">store</text>
  <text x="712" y="192.0" class="sub">SQLite or Postgres</text>
  <path class="wire" d="M560,178 L664,178" marker-end="url(#a)"/>
  <text x="612" y="171" class="lbl" text-anchor="middle">append</text>

  <!-- You, over HTTP -->
  <rect class="node k-plain" x="20" y="250" width="112" height="56" rx="10" filter="url(#lift)"/>
  <circle class="badge k-plain" cx="46" cy="278.0" r="13"/>
  <use href="#i-you" class="ic" x="38" y="270" width="16" height="16"/>
  <text x="68" y="275.0" class="title">you</text>
  <text x="68" y="292.0" class="sub">HTTP API</text>
  <path class="wire" d="M132,266 L208,266" marker-end="url(#a)"/>
  <path class="wire" d="M208,290 L132,290" marker-end="url(#a)"/>
  <text x="158" y="260" class="lbl mono" text-anchor="middle">prompt</text>
  <text x="158" y="304" class="lbl mono" text-anchor="middle">events</text>

  <!-- Hands, each dialled in from where it runs, each saying what it can do -->
  <rect class="panel" x="208" y="456" width="208" height="100" rx="12"/>
  <text x="224" y="476" class="eyebrow">A MACHINE</text>
  <rect class="node k-hand" x="220" y="484" width="184" height="62" rx="10" filter="url(#lift)"/>
  <circle class="badge k-hand" cx="242" cy="503" r="11"/>
  <use href="#i-hand" class="ic k-hand" x="234" y="495" width="16" height="16"/>
  <text x="260" y="508" class="title">hand <tspan class="mono hand">a1</tspan></text>
  <rect class="soft k-plain" x="232" y="518" width="65" height="18" rx="9"/>
  <text x="264.5" y="531.0" class="mono cap plain" text-anchor="middle">commands</text>
  <rect class="soft k-plain" x="302" y="518" width="45" height="18" rx="9"/>
  <text x="324.5" y="531.0" class="mono cap plain" text-anchor="middle">files</text>
  <rect class="soft k-plain" x="352" y="518" width="45" height="18" rx="9"/>
  <text x="374.5" y="531.0" class="mono cap plain" text-anchor="middle">clone</text>
  <rect class="panel" x="432" y="456" width="208" height="100" rx="12"/>
  <text x="448" y="476" class="eyebrow">A VM</text>
  <rect class="node k-hand" x="444" y="484" width="184" height="62" rx="10" filter="url(#lift)"/>
  <circle class="badge k-hand" cx="466" cy="503" r="11"/>
  <use href="#i-hand" class="ic k-hand" x="458" y="495" width="16" height="16"/>
  <text x="484" y="508" class="title">hand <tspan class="mono hand">b2</tspan></text>
  <rect class="soft k-plain" x="456" y="518" width="65" height="18" rx="9"/>
  <text x="488.5" y="531.0" class="mono cap plain" text-anchor="middle">commands</text>
  <rect class="soft k-plain" x="526" y="518" width="45" height="18" rx="9"/>
  <text x="548.5" y="531.0" class="mono cap plain" text-anchor="middle">files</text>
  <rect class="soft k-plain" x="576" y="518" width="45" height="18" rx="9"/>
  <text x="598.5" y="531.0" class="mono cap plain" text-anchor="middle">clone</text>
  <path class="wire k-hand" d="M304,400 L304,484" marker-end="url(#a-hand)"/>
  <path class="wire k-hand" d="M320,484 L320,400" marker-end="url(#a-hand)"/>
  <path class="wire k-hand" d="M528,400 L528,484" marker-end="url(#a-hand)"/>
  <path class="wire k-hand" d="M544,484 L544,400" marker-end="url(#a-hand)"/>
  <text x="296" y="444" class="lbl mono" text-anchor="end">call</text>
  <text x="328" y="444" class="lbl mono">result</text>
  <text x="664" y="494" class="lbl">Each hand dials in from where</text>
  <text x="664" y="511" class="lbl">it runs, says what it can do,</text>
  <text x="664" y="528" class="lbl">and runs the calls sent to it.</text>
</svg>
