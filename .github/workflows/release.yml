name: Release

# A tag vX.Y.Z, or vX.Y.Z-pre, on master: once every CI job passes on it,
# the image built from CI's static binaries, then a GitHub Release holding
# the binaries. Builds nothing of its own. The job's token is its only
# secret.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

# One release at a time, never cancelled, so no two race on latest or X.Y.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/savid/mensor

jobs:
  # The tag names the workspace's version, on master, and is not released
  # yet: a version is published once. Whether it is the newest stable
  # release decides latest, and the newest of its X.Y decides X.Y.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.verify.outputs.version }}
      latest: ${{ steps.verify.outputs.latest }}
      minor-latest: ${{ steps.verify.outputs.minor-latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || fail "$TAG is not vX.Y.Z or vX.Y.Z-pre"
          [[ $TAG == "v$version" ]] || fail "$TAG does not name the workspace's version, $version"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || fail "$TAG is not on master"
          if found=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName 2>&1); then
            fail "$TAG is released already: release the next version"
          elif [[ $found != "release not found" ]]; then
            fail "could not check for a release of $TAG: $found"
          fi
          newest() { git tag -l "$1" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1; }
          latest=false minor_latest=false
          if [[ $TAG != *-* && $(newest 'v*') == "$TAG" ]]; then latest=true; fi
          if [[ $TAG != *-* && $(newest "${TAG%.*}.*") == "$TAG" ]]; then minor_latest=true; fi
          {
            echo "version=$version"
            echo "latest=$latest"
            echo "minor-latest=$minor_latest"
          } >> "$GITHUB_OUTPUT"

  # Every CI job on the tagged commit, the static binaries and a dry run of
  # the image among them.
  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  # The image from the binaries CI uploaded in this run: X.Y.Z; X.Y while it
  # is the newest of X.Y; latest while it is the newest stable release. A
  # pre-release is tagged with its version alone.
  image:
    needs: [verify, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push the image to ghcr.io
      id-token: write # sign its attestation with Sigstore
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=${{ needs.verify.outputs.latest }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.verify.outputs.minor-latest }}
      - id: image
        uses: ./.github/actions/image
        with:
          push: "true"
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          # Storage records are kept for organizations' packages alone, and
          # this repository is a user's.
          create-storage-record: false
      # The bundle, for the release, to check the image offline.
      - name: Keep the bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/bundles"
          cp "$BUNDLE" "$RUNNER_TEMP/bundles/mensor-$VERSION-image.sigstore.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-image
          path: ${{ runner.temp }}/bundles/*.sigstore.json
          if-no-files-found: error
          retention-days: 7

  # The GitHub Release, once the image is out: CI's tarballs, their
  # checksums, and the attestation bundles. Its notes are the tag's message.
  release:
    needs: [verify, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # make the release
      id-token: write # sign the binaries' attestation with Sigstore
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mensor-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-image
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz > SHA256SUMS
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          LATEST: ${{ needs.verify.outputs.latest }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "dist/mensor-$VERSION-binaries.sigstore.json"
          pre=()
          if [[ $TAG == *-* ]]; then pre=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --notes-from-tag \
            --latest="$LATEST" "${pre[@]}" dist/*.tar.gz dist/SHA256SUMS dist/*.sigstore.json
